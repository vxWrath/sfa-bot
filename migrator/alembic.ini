# Alembic configuration.
# This file is used by the `alembic` command line tool.
# Run from the project root: alembic -c migrator/alembic.ini <command>

[alembic]
# %(here)s expands to the directory containing this file (migrator/).
script_location = %(here)s

# Database URL is read from the DATABASE_URL environment variable in env.py.
# Do not set sqlalchemy.url here.

# Revision file naming: NNNN_slug.py
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S